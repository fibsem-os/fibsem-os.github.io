name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  # the fibsem-os ref the developer pages are taken from (and their GitHub links point at)
  FIBSEM_OS_REF: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The developer pages are copied out of fibsem-os at build time
      # (scripts/sync-developer-docs.mjs); the repository is their source of truth.
      - name: Checkout fibsem-os
        uses: actions/checkout@v4
        with:
          repository: fibsem-os/fibsem-os
          ref: ${{ env.FIBSEM_OS_REF }}
          path: fibsem-os

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          FIBSEM_OS_DIR: ${{ github.workspace }}/fibsem-os
          FIBSEM_OS_REF: ${{ env.FIBSEM_OS_REF }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4